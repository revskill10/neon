# HiBusiness's images of this fork (branch hb/main): build-tools, then the storage image (pageserver, safekeeper,
# storage controller, broker) and the Postgres 17 compute, pushed to this repository owner's GHCR. Each image is
# tagged with the commit it was built from; the platform pins it by digest.
name: hb images

on:
  push:
    branches: [hb/main]
    # The upkeep's workflow changes no image
    paths-ignore: [.github/workflows/hb-upkeep.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: hb-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      # Each Postgres the images build is the one vendor/revisions.json names: its submodule's commit, read from the
      # commit itself (a pointer re-staged from an old checkout once built 17.8 while revisions.json said 17.11)
      - name: Postgres sources as vendor/revisions.json says
        run: |
          for v in $(jq -r 'keys[]' vendor/revisions.json); do
            want=$(jq -r --arg v "$v" '.[$v][1]' vendor/revisions.json)
            have=$(git ls-tree HEAD "vendor/postgres-$v" | awk '{print $3}')
            echo "$v: revisions.json $(jq -r --arg v "$v" '.[$v][0]' vendor/revisions.json) $want, submodule $have"
            [ "$want" = "$have" ] || { echo "::error::vendor/postgres-$v is $have, not $want as vendor/revisions.json says"; exit 1; }
          done
      # The tag names what the image is built from, so an unchanged build-tools is built once
      - id: tag
        run: echo "tag=$(cat build-tools/Dockerfile build-tools/package.json build-tools/package-lock.json $(find build-tools/patches -type f | sort) | sha256sum | cut -c1-40)-bookworm" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: exists
        run: docker manifest inspect "$REGISTRY/build-tools:${{ steps.tag.outputs.tag }}" >/dev/null 2>&1 && echo "yes=true" >> "$GITHUB_OUTPUT" || true
      - if: steps.exists.outputs.yes != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build-tools/Dockerfile
          build-args: DEBIAN_VERSION=bookworm
          push: true
          tags: ${{ env.REGISTRY }}/build-tools:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=build-tools
          cache-to: type=gha,scope=build-tools,mode=max

  storage:
    needs: build-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            REPOSITORY=${{ env.REGISTRY }}
            IMAGE=build-tools
            TAG=${{ needs.build-tools.outputs.tag }}
            DEBIAN_VERSION=bookworm
            GIT_VERSION=${{ github.sha }}
            BUILD_TAG=hb-${{ github.run_number }}
          push: true
          tags: ${{ env.REGISTRY }}/neon:hb-${{ github.sha }}
          cache-from: type=gha,scope=storage
          cache-to: type=gha,scope=storage,mode=min

  compute-v17:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: compute/compute-node.Dockerfile
          build-args: |
            PG_VERSION=v17
            EXTENSIONS=hb
            DEBIAN_VERSION=bookworm
            GIT_VERSION=${{ github.sha }}
            BUILD_TAG=hb-${{ github.run_number }}
          push: true
          tags: ${{ env.REGISTRY }}/compute-node-v17:hb-${{ github.sha }}
          cache-from: type=gha,scope=compute-v17
          cache-to: type=gha,scope=compute-v17,mode=min
